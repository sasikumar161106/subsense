version: '3.8'

services:
  # Spatial Database: PostGIS 16 (Section 7)
  postgis:
    image: postgis/postgis:16-3.4
    container_name: subsense-postgis
    environment:
      POSTGRES_DB: subsense_gis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-Memory Hot Cache: Redis (Section 5.5)
  redis:
    image: redis:7-alpine
    container_name: subsense-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # S3 Object Storage: MinIO for Multi-Tenant Tiles (Section 5.5)
  minio:
    image: minio/minio:latest
    container_name: subsense-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # SubSense Layer 5 Serving Gateway
  gis-service:
    build: .
    container_name: subsense-gis-layer
    ports:
      - "8000:8000"
    environment:
      SUBSENSE_ENVIRONMENT: production
      SUBSENSE_POSTGIS_URL: postgresql://postgres:postgrespassword@postgis:5432/subsense_gis
      SUBSENSE_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgis_data:
  minio_data:
