# SubSense Layer 4 - Site Configuration & Hyperparameters
# DGMS Safety Baseline

site_metadata:
  mine_id: "COAL-JH-PANEL7"
  seam_name: "Seam VII Top"
  overburden_depth_m: 210.0
  pillar_width_m: 28.5
  bord_width_m: 5.5

model_hyperparameters:
  alpha: 0.55             # Ensemble weighting: S_node = alpha * S_IF + (1 - alpha) * tanh(beta * MSE_AE)
  beta: 12.5              # Autoencoder MSE scaling factor
  
  isolation_forest:
    n_estimators: 100
    max_samples: 0.75
    contamination: 0.05
    random_state: 42

  autoencoder:
    input_dim: 12
    latent_dim: 4
    learning_rate: 0.001
    epochs: 40
    batch_size: 32

correlation_rules:
  delta_tilt_min_deg: 0.15           # Within-node concordant drift minimum tilt delta
  delta_displacement_min_mm: 1.5     # Within-node concordant drift minimum displacement delta
  neighbor_radius_m: 120.0           # Across-node spatial neighborhood radius R (meters)
  temporal_window_min: 45.0          # Across-node temporal coincidence window tau (minutes)
  isolated_node_penalty: 0.25        # Down-weighting factor for uncorroborated single-node anomalies

relocation:
  distance_threshold_m: 15.0         # Centroid GPS displacement triggering instant retraining

feature_pipeline:
  window_duration_sec: 300           # 5-minute rolling window
  stride_sec: 30                     # 30-second stride
  sample_rate_hz: 1.0                # Nominal sensor reporting rate

trend_classification:
  theta_vel_mm_h: 0.25               # 1st derivative velocity threshold (Sustained)
  theta_accel_mm_h2: 0.050           # 2nd derivative curvature threshold (Accelerating)

forecasting:
  horizon_hours: 48                  # Forecast horizon (24-72h)
  history_steps: 192                 # Past 48h @ 15-min aggregation (48 * 4 = 192)
  hidden_units: 64
  num_layers: 2
  quantiles: [0.1, 0.5, 0.9]

geostatistics:
  variogram_model: "spherical"       # "spherical" or "matern"
  grid_resolution_m: 10.0            # 10m x 10m risk surface cells
  max_latency_budget_sec: 30.0

gnn:
  num_layers: 3
  in_channels: 13                    # 12-D feature vector + 1-D anomaly score
  edge_dim: 4                        # distance, delta_z, fault_flag, retreat_angle
  hidden_dim: 32
  heads: 2

insar:
  divergence_threshold_mm: 8.0       # Threshold for flagging macro-divergence blind spots
  cadence_days: 12

fusion:
  confidence_weights:
    w1_agreement: 0.50               # Model consensus weight
    w2_correlation: 0.30             # Spatial-temporal cross-correlation weight
    w3_qos: 0.20                     # Mesh telemetry QoS weight
  thresholds:
    advisory_s_node: 0.65
    advisory_max_confidence: 0.60
    warning_s_node: 0.75
    warning_concordant_channels_min: 2
    warning_c_corr_min: 0.70
    warning_c_corr_radius_m: 120.0
    warning_r_gnn_min: 0.70
    critical_ttc_override_hours: 8.0
    critical_ttc_floor_hours: 12.0
    critical_instantaneous_disp_mm: 10.0

explainability:
  top_k_gat_edges: 3
  shap_nsamples: 100

governance:
  multi_party_signoff_threshold_pct: 15.0
  ledger_path: "logs/audit_ledger.json"
