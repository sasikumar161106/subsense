pipeline:
  window_size: 60           # 60 samples per sliding window (e.g. 1 minute at 1Hz or 1 hour at 1/min)
  window_stride: 10         # Stride between successive inference evaluations
  sla_latency_limit_sec: 15.0
  telemetry_staleness_threshold_sec: 30.0

fault_filtering:
  min_battery_voltage: 2.4
  min_rssi_dbm: -115.0
  flatline_variance_threshold: 1e-6
  spike_z_score_threshold: 4.5

anomaly_models:
  isolation_forest:
    n_estimators: 100
    contamination: 0.05
    random_state: 42
  autoencoder:
    input_dim: 8            # Engineered feature dimension
    hidden_dims: [16, 8, 4]
    latent_dim: 2
    learning_rate: 0.001
    batch_size: 32
    epochs: 25
  ensemble:
    weight_if: 0.45
    weight_ae: 0.55
    anomaly_threshold: 0.60

gnn_correlation:
  spatial_radius_meters: 150.0
  embedding_dim: 16
  message_passing_hops: 2
  correlation_threshold: 0.65
  min_cluster_size: 2

lstm_forecasting:
  sequence_length: 20
  feature_dim: 4            # [tilt, vibration_rms, displacement, anomaly_score]
  hidden_dim: 32
  num_layers: 2
  critical_displacement_mm: 45.0
  critical_tilt_deg: 5.0

kriging:
  model: "exponential"     # "exponential" | "spherical" | "gaussian"
  variogram_range_m: 250.0
  sill: 1.0
  nugget: 0.05
  grid_resolution_m: 10.0

insar:
  velocity_discrepancy_threshold_mm_year: 15.0
  max_pairing_distance_m: 100.0

feedback_loop:
  max_threshold_nudge: 0.15
  feedback_retrain_trigger_count: 50
  retrain_schedule_cron: "0 2 * * 0" # Weekly Sunday at 02:00
