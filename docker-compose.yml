version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Core Infrastructure: PostGIS Spatial DB & Redis Hot Tile Cache
  # ---------------------------------------------------------------------------
  postgis:
    image: postgis/postgis:16-3.4
    container_name: subsense-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: subsense_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subsense_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - subsense-net

  redis:
    image: redis:7-alpine
    container_name: subsense-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - subsense-net

  # ---------------------------------------------------------------------------
  # Layer 6: Fastify BFF Gateway & Real-Time WebSocket Relay
  # ---------------------------------------------------------------------------
  bff-gateway:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.bff
    container_name: subsense-bff-gateway
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgrespassword@postgis:5432/subsense_db
      JWT_SECRET: subsense-jwt-safety-compliance-secret-key-2026
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - subsense-net

  # ---------------------------------------------------------------------------
  # Layer 6: Mine Operations Web Dashboard Frontend
  # ---------------------------------------------------------------------------
  web-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.web
    container_name: subsense-web-dashboard
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      VITE_BFF_URL: http://localhost:3001
    depends_on:
      - bff-gateway
    networks:
      - subsense-net

  # ---------------------------------------------------------------------------
  # Edge Gateway Bridge: ESP32 USB Serial to Cloud Canonical Ingestion
  # ---------------------------------------------------------------------------
  gateway-bridge:
    build:
      context: ./gateway-bridge
      dockerfile: Dockerfile
    container_name: subsense-gateway-bridge
    restart: unless-stopped
    environment:
      INGEST_URL: http://bff-gateway:3001/api/v1/telemetry/broadcast
      SER_PORT: /dev/ttyUSB0
      SER_BAUD: 115200
    depends_on:
      - bff-gateway
    networks:
      - subsense-net

networks:
  subsense-net:
    name: subsense-network
    driver: bridge

volumes:
  pgdata:
    name: subsense_pgdata
